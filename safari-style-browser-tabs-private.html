<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f5f7">
<title>Safari — Start Page</title>
<style>
:root{
  color-scheme:light;
  --chrome:#f5f5f7;--chrome2:#ececef;--line:#d8d8dc;--ink:#1d1d1f;
  --muted:#77777d;--blue:#087cff;--card:rgba(255,255,255,.72);
  --shadow:0 18px 55px rgba(0,0,0,.12);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#fff}
body{overflow:hidden}
.browser{height:100dvh;display:flex;flex-direction:column;background:var(--chrome)}
.titlebar{height:48px;display:flex;align-items:center;padding:0 16px;gap:16px;background:var(--chrome)}
.traffic{display:flex;gap:8px;align-items:center;width:54px;flex:none}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.red{background:#ff5f57}.yellow{background:#febc2e}.green{background:#28c840}
.tabs{height:40px;display:flex;align-items:stretch;gap:3px;flex:1;min-width:0}
.tab{height:36px;align-self:end;min-width:120px;max-width:230px;flex:1;border-radius:9px 9px 0 0;background:#e8e8eb;color:#55565b;display:flex;align-items:center;gap:9px;padding:0 13px;font-size:12px;position:relative;min-width:0}
.tab.active{background:#fff;color:#1d1d1f}
.tab.private{background:#e4e0ec;color:#4e4262}.tab.private.active{background:#f3eff8;color:#30243f}
.tab .favicon{width:14px;height:14px;display:grid;place-items:center;font-size:12px;flex:none}
.tab .tabname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.tab .close{opacity:0;font-size:16px;color:#777;cursor:pointer}.tab:hover .close{opacity:1}
.addtab{border:0;background:transparent;color:#6b6b70;font-size:21px;width:34px;cursor:pointer}
.toolbar{height:52px;background:var(--chrome);display:flex;align-items:center;padding:0 14px;gap:12px}
.navgroup{display:flex;align-items:center;gap:3px}
.toolbtn{border:0;background:transparent;color:#55565b;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;cursor:pointer}
.toolbtn:hover{background:#e5e5e9}
.toolbtn:disabled{opacity:.3;cursor:default}
.toolbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.address-wrap{height:34px;max-width:760px;flex:1;margin:0 auto;border:1px solid #d4d4d8;border-radius:10px;background:#e9e9ed;display:flex;align-items:center;padding:0 10px;gap:8px;transition:.15s}
.address-wrap:focus-within{background:#fff;border-color:#a9a9b0;box-shadow:0 0 0 3px rgba(0,122,255,.09)}
.address-wrap svg{width:14px;height:14px;stroke:#73737a;fill:none;stroke-width:1.7;flex:none}
.address{border:0;outline:0;background:transparent;color:#252529;text-align:center;font-size:13px;flex:1;min-width:0;font-family:inherit}
.address::placeholder{color:#77777d}
.address-actions{display:flex;gap:3px}
.righttools{display:flex;align-items:center;gap:5px}
.separator{height:22px;width:1px;background:#d5d5d9;margin:0 3px}
.bookmarkbar{height:34px;background:var(--chrome);display:flex;align-items:center;justify-content:center;gap:24px;padding:0 20px;border-bottom:1px solid #e3e3e6;font-size:11px;color:#55565b}
.bookmark{display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}.bookmark:hover{color:#087cff}
.bookmark .mini{font-size:13px}
.viewport{flex:1;min-height:0;position:relative;background:#fff;overflow:auto}
.home{min-height:100%;background:radial-gradient(ellipse at 50% 40%,#fff 0,#fafafd 58%,#f5f5f8 100%);padding:8vh 24px 60px;display:flex;flex-direction:column;align-items:center}
.date{font-size:13px;color:#77777d;margin-bottom:12px}
.clock{font-size:44px;font-weight:300;letter-spacing:-2px;margin-bottom:34px}
.greeting{font-size:27px;font-weight:600;letter-spacing:-.8px;margin:0 0 25px}
.searchbox{height:48px;width:min(620px,92vw);border-radius:13px;background:#fff;border:1px solid #dedee3;box-shadow:0 3px 14px rgba(0,0,0,.055);display:flex;align-items:center;padding:0 16px;gap:12px}
.searchbox svg{width:18px;height:18px;stroke:#77777d;fill:none;stroke-width:1.8}
.searchbox input{border:0;outline:0;flex:1;min-width:0;font:14px inherit;color:#222;background:transparent}
.searchbox input::placeholder{color:#929298}
.section{width:min(680px,94vw);margin-top:42px}
.section-head{font-size:12px;font-weight:600;color:#66666c;margin:0 0 17px 4px}
.favorites{display:grid;grid-template-columns:repeat(6,1fr);gap:18px 14px}
.fav{display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;min-width:0}
.favicon{width:52px;height:52px;border-radius:15px;background:#fff;box-shadow:0 2px 9px rgba(0,0,0,.08);display:grid;place-items:center;font-size:22px;font-weight:600;color:#333;border:1px solid rgba(0,0,0,.035);transition:transform .15s;overflow:hidden}.favicon img{width:28px;height:28px;object-fit:contain}.bookmark img{width:14px;height:14px;object-fit:contain;border-radius:3px}
.fav:hover .favicon{transform:translateY(-2px)}
.fav span:last-child{font-size:11px;color:#55565b;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.google{color:#4285f4}.github{background:#202124;color:white}.yt{color:#f00}.reddit{color:#ff4500}.wiki{font-family:Georgia}
.privacy{margin-top:40px;color:#85858b;font-size:11px}
.webframe{display:none;width:100%;height:100%;border:0;background:#fff}
.status{height:22px;background:var(--chrome);border-top:1px solid #e7e7ea;color:#77777d;font-size:10px;display:flex;align-items:center;justify-content:space-between;padding:0 13px}
.menu{position:absolute;right:16px;top:10px;width:220px;background:rgba(250,250,252,.97);backdrop-filter:blur(20px);border:1px solid #d8d8dc;border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:10}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;padding:9px 11px;border:0;background:transparent;border-radius:7px;font:13px inherit;color:#222;cursor:pointer}
.menu button:hover{background:#e9e9ed}
@media(max-width:650px){
 .titlebar{padding:0 9px;gap:8px}.traffic{width:48px}.tab{min-width:80px;padding:0 8px}.tab:nth-child(n+3){display:none}
 .toolbar{padding:0 7px;gap:5px}.righttools .optional{display:none}.bookmarkbar{justify-content:flex-start;overflow:auto;gap:18px}
 .home{padding-top:9vh}.favorites{grid-template-columns:repeat(3,1fr);max-width:360px}.section{margin-top:34px}
}
body.dark{--chrome:#202124;--chrome2:#292a2d;--line:#3a3b40;--ink:#f2f2f4;--muted:#aaa;--card:rgba(40,40,44,.8);color:var(--ink);background:#171719;color-scheme:dark}
body.dark .browser,body.dark .titlebar,body.dark .toolbar,body.dark .bookmarkbar,body.dark .status{background:#202124;color:#c9c9ce}
body.dark .tab{background:#292a2d;color:#aaa}body.dark .tab.active{background:#171719;color:#f5f5f7}
body.dark .tab.private{background:#393342;color:#d9c9ee}body.dark .tab.private.active{background:#302a39;color:#f1e8fa}
body.dark .address-wrap{background:#303136;border-color:#42434a}body.dark .address{color:#eee}
body.dark .viewport{background:#171719}body.dark .home{background:radial-gradient(ellipse at 50% 40%,#242428 0,#1c1c20 60%,#171719 100%)}
body.dark .searchbox,body.dark .favicon{background:#292a2e;border-color:#3c3c42;color:#eee}
body.dark .searchbox input,body.dark .fav span:last-child{color:#eee}body.dark .section-head,body.dark .date{color:#aaa}
body.dark .toolbtn{color:#c9c9ce}body.dark .toolbtn:hover{background:#34353a}body.dark .menu{background:rgba(40,40,44,.97);border-color:#444}body.dark .menu button{color:#eee}body.dark .menu button:hover{background:#38393e}

.panel{display:none;position:absolute;right:16px;top:12px;width:min(340px,calc(100vw - 32px));max-height:min(76vh,620px);overflow:auto;z-index:12;background:rgba(250,250,252,.97);backdrop-filter:blur(22px);border:1px solid #d8d8dc;border-radius:14px;box-shadow:0 18px 55px rgba(0,0,0,.16);padding:14px}
.panel.show{display:block}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:14px}
.panel-close{border:0;background:transparent;font-size:22px;color:#777;cursor:pointer}
.panel-row{padding:11px 0;border-bottom:1px solid #e5e5e8;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
.panel-row:last-child{border-bottom:0}.panel-row small{display:block;color:#777;margin-top:3px;font-size:11px}
.panel button.action{border:1px solid #d2d2d7;background:#fff;border-radius:8px;padding:7px 10px;font:12px inherit;cursor:pointer;color:#222}
.panel select{border:1px solid #d2d2d7;border-radius:7px;padding:6px;background:#fff;color:#222}
.panel .empty{color:#777;font-size:12px;padding:14px 0}
.panel .saved-link{font-size:12px;overflow-wrap:anywhere;max-width:210px}
body.dark .panel{background:rgba(40,40,44,.97);border-color:#444}
body.dark .panel-row{border-color:#444}body.dark .panel button.action,body.dark .panel select{background:#303136;border-color:#555;color:#eee}
</style>
</head>
<body>
<div class="browser">
  <div class="titlebar">
    <div class="traffic"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
    <div class="tabs" id="tabs">
      <div class="tab active"><span class="favicon">✦</span><span class="tabname">Start Page</span><span class="close">×</span></div>
    </div>
    <button class="addtab" title="New Tab" id="newTab" aria-label="Create new tab">+</button>
  </div>
  <div class="toolbar">
    <div class="navgroup">
      <button class="toolbtn" id="back" title="Back" disabled><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="toolbtn" id="forward" title="Forward" disabled><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="toolbtn" id="reload" title="Reload"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-5L4 8"/><path d="M4 4v4h4M4 13a8 8 0 0 0 14 5l2-2"/><path d="M20 20v-4h-4"/></svg></button>
    </div>
    <div class="address-wrap">
      <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <input class="address" id="address" placeholder="Search or enter website name" autocomplete="off" spellcheck="false">
      <div class="address-actions">
        <button class="toolbtn" id="share" title="Share"><svg viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4"/><path d="M5 12v8h14v-8"/></svg></button>
      </div>
    </div>
    <div class="righttools">
      <button class="toolbtn" id="privateTab" title="New Private Tab" aria-label="New Private Tab"><svg viewBox="0 0 24 24"><path d="M3 10h18l-2-5H5l-2 5Z"/><path d="M5 10v2a3 3 0 0 0 6 0v-2m2 0v2a3 3 0 0 0 6 0v-2"/><path d="M12 15v4m-3 0h6"/></svg></button>
      <button class="toolbtn optional" id="bookmark" title="Bookmark"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></svg></button>
      <button class="toolbtn" id="downloads" title="Downloads"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M5 18v3h14v-3"/></svg></button>
      <button class="toolbtn" id="menuBtn" title="Show menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    </div>
  </div>
  <div class="bookmarkbar">
    <div class="bookmark" data-url="https://www.icloud.com"><img src="https://www.google.com/s2/favicons?domain=icloud.com&sz=64" alt=""> iCloud</div>
    <div class="bookmark" data-url="https://www.apple.com"><img src="https://www.google.com/s2/favicons?domain=apple.com&sz=64" alt=""> Apple</div>
    <div class="bookmark" data-url="https://www.google.com"><img src="https://www.google.com/s2/favicons?domain=google.com&sz=64" alt=""> Google</div>
    <div class="bookmark" data-url="https://www.youtube.com"><img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64" alt=""> YouTube</div>
    <div class="bookmark" data-url="https://github.com"><img src="https://www.google.com/s2/favicons?domain=github.com&sz=64" alt=""> GitHub</div>
  </div>
  <main class="viewport" id="viewport">
    <div id="privateNotice" style="display:none;position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:2;background:#eee8f5;color:#4b3c5c;border:1px solid #d8cce6;border-radius:20px;padding:7px 13px;font-size:11px;white-space:nowrap">Private Tab · This session is not saved by this page</div>
    <section class="home" id="home">
      <div class="date" id="date"></div>
      <div class="clock" id="clock"></div>
      <h1 class="greeting">Start Page</h1>
      <form class="searchbox" id="searchForm">
        <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
        <input id="homeSearch" placeholder="Search the web" autocomplete="off">
      </form>
      <div class="section">
        <div class="section-head">Favourites</div>
        <div class="favorites">
          <div class="fav" data-url="https://www.google.com"><div class="favicon"><img src="https://www.google.com/s2/favicons?domain=google.com&sz=128" alt="Google"></div><span>Google</span></div>
          <div class="fav" data-url="https://www.youtube.com"><div class="favicon"><img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128" alt="YouTube"></div><span>YouTube</span></div>
          <div class="fav" data-url="https://github.com"><div class="favicon"><img src="https://www.google.com/s2/favicons?domain=github.com&sz=128" alt="GitHub"></div><span>GitHub</span></div>
          <div class="fav" data-url="https://www.reddit.com"><div class="favicon"><img src="https://www.google.com/s2/favicons?domain=reddit.com&sz=128" alt="Reddit"></div><span>Reddit</span></div>
          <div class="fav" data-url="https://wikipedia.org"><div class="favicon"><img src="https://www.google.com/s2/favicons?domain=wikipedia.org&sz=128" alt="Wikipedia"></div><span>Wikipedia</span></div>
          <div class="fav" data-url="https://www.apple.com"><div class="favicon"><img src="https://www.google.com/s2/favicons?domain=apple.com&sz=128" alt="Apple"></div><span>Apple</span></div>
        </div>
      </div>
      <div class="privacy">Your browsing starts here.</div>
    </section>
    <iframe class="webframe" id="webframe" title="Web page" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div class="menu" id="menu">
      <button id="newTabMenu">New Tab <span style="float:right;color:#888">Ctrl+T</span></button>
      <button id="newPrivateTabMenu">New Private Tab <span style="float:right;color:#888">Ctrl+Shift+N</span></button>
      <button id="homeMenu">Start Page</button>
      <button id="showBookmarks">Show Bookmarks</button>
      <button id="showDownloads">Downloads</button>
      <button id="showSettings">Settings</button>
      <button id="openExternal">Open Current Page in New Tab</button>
    </div>
    <div class="panel" id="panel">
      <div class="panel-head"><strong id="panelTitle">Settings</strong><button class="panel-close" id="panelClose" aria-label="Close">×</button></div>
      <div id="panelContent"></div>
    </div>
  </main>
  <div class="status"><span id="statusText">Start Page</span><span>Safari-style concept</span></div>
</div>
<script>
const $=id=>document.getElementById(id);
const STORE={theme:'fennec-safari-theme',bookmarks:'fennec-safari-bookmarks',history:'fennec-safari-history',engine:'fennec-safari-engine'};
let current='',historyList=[],historyIndex=-1,downloads=[],tabs=[],activeTab=0;
let bookmarks=JSON.parse(localStorage.getItem(STORE.bookmarks)||'[]');
let engine=localStorage.getItem(STORE.engine)||'Google';

function updateClock(){
 const now=new Date();
 $('clock').textContent=now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
 $('date').textContent=now.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});
}
updateClock();setInterval(updateClock,30000);
if(localStorage.getItem(STORE.theme)==='dark')document.body.classList.add('dark');

function normalize(value){
 let v=value.trim();if(!v)return '';
 if(/^https?:\/\//i.test(v))return v;
 if(v.includes('.')&&!v.includes(' '))return 'https://'+v;
 const engines={
  Google:'https://www.google.com/search?q=',
  Bing:'https://www.bing.com/search?q=',
  DuckDuckGo:'https://duckduckgo.com/?q='
 };
 return (engines[engine]||engines.Google)+encodeURIComponent(v);
}
function updateNav(){
 $('back').disabled=historyIndex<=0;
 $('forward').disabled=historyIndex>=historyList.length-1;
}
function navigate(value,push=true){
 const url=normalize(value);if(!url)return;
 current=url;address.value=url;
 $('home').style.display='none';$('webframe').style.display='block';
 $('webframe').src=url;
 if(push){historyList=historyList.slice(0,historyIndex+1);historyList.push(url);historyIndex++;}
 if(!isPrivateTab())localStorage.setItem(STORE.history,JSON.stringify(historyList.slice(-100)));
 const tab=tabs[activeTab];if(tab){tab.url=url;tab.history=historyList;tab.historyIndex=historyIndex;}
 updateNav();$('statusText').textContent=isPrivateTab()?'Private · '+url:url;
 updateTabTitle(url);
}
function showHome(){
 current='';address.value='';$('webframe').src='about:blank';
 $('webframe').style.display='none';$('home').style.display='flex';
 $('privateNotice').style.display=isPrivateTab()?'block':'none';
 $('statusText').textContent=isPrivateTab()?'Private Tab':'Start Page';updateTabTitle(isPrivateTab()?'Private Tab':'Start Page');
}
function updateTabTitle(title){
 const tab=tabs[activeTab];if(tab){tab.title=title;tab.url=current;}
 renderTabs();
}
function renderTabs(){
 const host=$('tabs');host.innerHTML='';
 tabs.forEach((tab,i)=>{
  const el=document.createElement('div');el.className='tab'+(i===activeTab?' active':'')+(tab.private?' private':'');
  const fav=document.createElement('span');fav.className='favicon';fav.textContent=tab.private?'◐':'◉';fav.title=tab.private?'Private tab':'Tab';
  const name=document.createElement('span');name.className='tabname';name.textContent=tab.title||'Start Page';
  const close=document.createElement('span');close.className='close';close.textContent='×';close.title='Close tab';
  close.onclick=e=>{e.stopPropagation();closeTab(i)};
  el.append(fav,name,close);el.onclick=()=>switchTab(i);host.append(el);
 });
}
function newTab(isPrivate=false){
 tabs.push({title:isPrivate?'Private Tab':'Start Page',url:'',private:isPrivate,history:[],historyIndex:-1});
 activeTab=tabs.length-1;historyList=[];historyIndex=-1;renderTabs();showHome();
 $('privateNotice').style.display=isPrivate?'block':'none';
 $('statusText').textContent=isPrivate?'Private Tab':'Start Page';
}
function isPrivateTab(){return !!tabs[activeTab]?.private;}
function newPrivateTab(){newTab(true);closeMenu();}

function switchTab(i){
 if(i<0||i>=tabs.length)return;activeTab=i;renderTabs();
 const tab=tabs[i];if(tab.url)navigate(tab.url,false);else showHome();
}
function closeTab(i){
 if(tabs.length===1){tabs[0]={title:'Start Page',url:''};switchTab(0);return}
 tabs.splice(i,1);if(activeTab>=i)activeTab=Math.max(0,activeTab-1);
 switchTab(activeTab);
}
function search(q){navigate(q)}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();search($('homeSearch').value)});
$('address').addEventListener('keydown',e=>{if(e.key==='Enter')navigate(address.value)});
$('back').onclick=()=>{if(historyIndex>0){historyIndex--;navigate(historyList[historyIndex],false)}};
$('forward').onclick=()=>{if(historyIndex<historyList.length-1){historyIndex++;navigate(historyList[historyIndex],false)}};
$('reload').onclick=()=>{if(current)$('webframe').src=current;else showHome()};
$('newTab').onclick=()=>newTab(false);$('privateTab').onclick=newPrivateTab;
$('newTabMenu').onclick=()=>{newTab(false);closeMenu()};
$('homeMenu').onclick=()=>{showHome();closeMenu()};
$('openExternal').onclick=()=>{if(current)window.open(current,'_blank','noopener');closeMenu()};
document.querySelectorAll('[data-url]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.url)));

function saveBookmarks(){localStorage.setItem(STORE.bookmarks,JSON.stringify(bookmarks));renderBookmarkBar()}
function renderBookmarkBar(){
 const bar=document.querySelector('.bookmarkbar');
 const defaults=[
  ['iCloud','https://www.icloud.com'],['Apple','https://www.apple.com'],
  ['Google','https://www.google.com'],['YouTube','https://www.youtube.com'],
  ['GitHub','https://github.com']
 ];
 const all=[...defaults,...bookmarks.filter(b=>!defaults.some(d=>d[1]===b.url)).map(b=>[b.title,b.url])];
 bar.innerHTML='';
 all.forEach(([title,url])=>{
  const el=document.createElement('div');el.className='bookmark';el.title=url;
  const img=document.createElement('img');img.src='https://www.google.com/s2/favicons?domain='+encodeURIComponent(new URL(url).hostname)+'&sz=64';img.alt='';
  const label=document.createTextNode(' '+title);el.append(img,label);el.onclick=()=>navigate(url);bar.append(el);
 });
}
function addBookmark(){
 if(!current){openPanel('Bookmarks');return}
 if(bookmarks.some(b=>b.url===current)){bookmarks=bookmarks.filter(b=>b.url!==current)}
 else bookmarks.unshift({title:new URL(current).hostname.replace(/^www\./,''),url:current});
 saveBookmarks();openPanel('Bookmarks');
}
$('bookmark').onclick=addBookmark;

function openPanel(name){
 closeMenu();$('panelTitle').textContent=name;$('panelContent').innerHTML='';
 const content=$('panelContent');
 const row=(label,description,control)=>{const el=document.createElement('div');el.className='panel-row';const txt=document.createElement('div');txt.textContent=label;if(description){const sm=document.createElement('small');sm.textContent=description;txt.append(sm)}el.append(txt,control);content.append(el)};
 const btn=(label,fn)=>{const b=document.createElement('button');b.className='action';b.textContent=label;b.onclick=fn;return b};
 if(name==='Settings'){
  const theme=document.createElement('select');[['system','System'],['light','Light'],['dark','Dark']].forEach(([v,t])=>{let o=document.createElement('option');o.value=v;o.textContent=t;theme.append(o)});
  theme.value=localStorage.getItem(STORE.theme)||'light';theme.onchange=()=>setTheme(theme.value);
  row('Appearance','Choose light or dark mode',theme);
  const search=document.createElement('select');['Google','Bing','DuckDuckGo'].forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;search.append(o)});
  search.value=engine;search.onchange=()=>{engine=search.value;localStorage.setItem(STORE.engine,engine)};
  row('Search engine','Used for searches typed in the address bar',search);
  row('Browsing data','Clear saved history from this prototype',btn('Clear history',()=>{historyList=[];historyIndex=-1;localStorage.removeItem(STORE.history);updateNav();alert('History cleared.')}));
  row('Bookmarks','Remove all custom saved bookmarks',btn('Clear bookmarks',()=>{bookmarks=[];saveBookmarks();openPanel('Bookmarks')}));
  const note=document.createElement('div');note.className='empty';note.textContent='Settings are saved on this device. This is a web-based browser interface, not a standalone browser engine.';content.append(note);
 }else if(name==='Bookmarks'){
  if(!bookmarks.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No custom bookmarks yet. Open a website and click the star button to save it.';content.append(empty)}
  bookmarks.forEach((b,i)=>{row(b.title,b.url,btn('Open',()=>{navigate(b.url);closePanel()}));const del=btn('Remove',()=>{bookmarks.splice(i,1);saveBookmarks();openPanel('Bookmarks')});content.lastChild.append(del)});
 }else if(name==='Downloads'){
  const save=btn('Download current link (.url)',()=>{
   if(!current){alert('Open a website first.');return}
   const blob=new Blob(['[InternetShortcut]\\r\\nURL='+current+'\\r\\n'],{type:'application/internet-shortcut'});
   const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(new URL(current).hostname||'website')+'.url';a.click();URL.revokeObjectURL(a.href);
   downloads.unshift({name:a.download,url:current,time:new Date().toLocaleTimeString()});openPanel('Downloads');
  });
  row('Save website shortcut','Downloads a shortcut to the current address',save);
  if(!downloads.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No downloads from this prototype yet. Website file downloads may be blocked by the embedded page.';content.append(empty)}
  downloads.forEach(d=>row(d.name,d.time,btn('Open',()=>window.open(d.url,'_blank','noopener'))));
 }
 $('panel').classList.add('show');
}
function closePanel(){$('panel').classList.remove('show')}
function closeMenu(){$('menu').classList.remove('show')}
function setTheme(mode){
 document.body.classList.toggle('dark',mode==='dark');
 if(mode==='system')document.body.classList.toggle('dark',matchMedia('(prefers-color-scheme: dark)').matches);
 localStorage.setItem(STORE.theme,mode);
}
$('panelClose').onclick=closePanel;
$('newPrivateTabMenu').onclick=newPrivateTab;
$('showBookmarks').onclick=()=>openPanel('Bookmarks');
$('showDownloads').onclick=()=>openPanel('Downloads');
$('showSettings').onclick=()=>openPanel('Settings');
$('downloads').onclick=()=>openPanel('Downloads');
$('menuBtn').onclick=()=>{$('menu').classList.toggle('show');closePanel()};
$('darkMode').onclick=()=>{setTheme(document.body.classList.contains('dark')?'light':'dark');closeMenu()};
$('menu').addEventListener('click',e=>e.stopPropagation());
document.addEventListener('click',e=>{if(!$('menu').contains(e.target)&&e.target!==$('menuBtn'))closeMenu();if(!$('panel').contains(e.target)&&!['downloads','showSettings','showBookmarks','showDownloads'].includes(e.target.id))closePanel()});
$('share').onclick=async()=>{
 if(!current){alert('Open a website first.');return}
 try{await navigator.clipboard.writeText(current);$('statusText').textContent='Address copied to clipboard'}
 catch{address.focus();address.select();document.execCommand('copy');$('statusText').textContent='Address copied'}
};
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='l'){e.preventDefault();address.focus();address.select()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='t'){e.preventDefault();newTab(false)}
 if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='n'){e.preventDefault();newPrivateTab()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='w'){e.preventDefault();closeTab(activeTab)}
 if(e.key==='Escape'){closeMenu();closePanel()}
});
tabs=[{title:'Start Page',url:''}];renderTabs();renderBookmarkBar();updateNav();
</script>
</body>
</html>
